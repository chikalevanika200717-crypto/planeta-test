<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Планета Недвижимость · тестовое задание</title>
<script>
  (function(){ var t=null; try{ t=localStorage.getItem('prc-theme'); }catch(e){}
    if(!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.dataset.theme = t; })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1d2433; --on-ink:#ffffff; --muted:#6b7280; --line:#e6e2d8;
    --field:#fffdf9; --soft:#f3f0e9; --soft2:#ece8de; --header:rgba(246,244,239,.92); --lead:#384152;
    --accent:#1f6f5c; --accent-soft:#e3f1ec; --warn:#b4531f; --warn-soft:#fdeee3; --red:#c02626; --dot-ring:#f6d6d6;
    --paste:#ffe08a; --big:#ffc9a8; --away:#c9ccd3; --q:#3b6fd8;
    --radius:14px; color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#13161c; --card:#1b1f27; --ink:#e7e5e0; --on-ink:#13161c; --muted:#99a0ac; --line:#2c313b;
    --field:#171a21; --soft:#222731; --soft2:#2a2f3a; --header:rgba(19,22,28,.9); --lead:#c4c8d0;
    --accent:#2f9b7e; --accent-soft:#183329; --warn:#f0965f; --warn-soft:#3a271b; --red:#f06b6b; --dot-ring:rgba(210,59,59,.25);
    --paste:#6a5510; --big:#73401f; --away:#4a505c; --q:#6b98f0;
    color-scheme:dark;
  }
  .theme{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
  .theme:hover{background:var(--soft)}
  body{transition:background .2s,color .2s}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.55}
  a{color:var(--accent)}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--header);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
  .brand{font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;cursor:pointer}
  .dot{width:10px;height:10px;border-radius:50%;background:#d23b3b;box-shadow:0 0 0 4px var(--dot-ring)}
  nav{display:flex;gap:6px;flex-wrap:wrap}
  nav a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
  nav a.on{background:var(--ink);color:var(--on-ink)}
  main{max-width:920px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:40px;line-height:1.1;letter-spacing:-.02em;margin:0 0 14px}
  h2{font-size:24px;letter-spacing:-.01em;margin:0 0 10px}
  h3{font-size:17px;margin:0 0 6px}
  .lead{font-size:19px;color:var(--lead);max-width:720px}
  .muted{color:var(--muted)}
  .small{font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:16px 0}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media (max-width:760px){.grid3,.grid4{grid-template-columns:1fr 1fr} h1{font-size:30px}}
  @media (max-width:480px){.grid3,.grid4{grid-template-columns:1fr}}
  .step{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .step .n{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:var(--on-ink);text-decoration:none}
  .btn:hover{filter:brightness(1.15)}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .btn.green{background:var(--accent);color:#fff}
  .btn.sm{padding:7px 12px;font-size:14px;border-radius:8px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .note{background:var(--accent-soft);border-radius:12px;padding:14px 16px}
  .note.warn{background:var(--warn-soft)}
  textarea,input[type=text]{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--field);color:var(--ink)}
  textarea:focus,input:focus{outline:none;border-color:var(--accent)}
  textarea.answer{min-height:320px;resize:vertical}
  textarea.qa{min-height:150px}
  .task-body p{margin:0 0 10px} .task-body ul,.task-body ol{margin:0 0 10px;padding-left:22px}
  .pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft2)}
  .rec{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--red)}
  .rec::before{content:"";width:8px;height:8px;border-radius:50%;background:#d23b3b;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.25}}
  .timer{font-family:'JetBrains Mono',monospace;font-size:28px;color:var(--muted);font-weight:500;letter-spacing:-.02em}
  .timer.low{color:var(--red)}
  .bar{height:6px;border-radius:6px;background:var(--soft2);overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
  .modal{position:fixed;inset:0;background:rgba(20,24,33,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
  .modal .card{max-width:480px;width:100%}
  .code{font-family:'JetBrains Mono',monospace;font-size:12px;min-height:120px;word-break:break-all}
  .metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .metric b{display:block;font-size:24px;letter-spacing:-.01em}
  .metric span{font-size:13px;color:var(--muted)}
  .signals{list-style:none;padding:0;margin:0}
  .signals li{padding:10px 12px;border-radius:10px;margin:6px 0;background:var(--soft)}
  .signals li.hi{background:var(--warn-soft)}
  .timeline{position:relative;height:34px;background:var(--soft);border-radius:8px;cursor:pointer;overflow:hidden;margin:10px 0 4px}
  .timeline .m{position:absolute;top:0;bottom:0;min-width:3px}
  .timeline .m.p{background:#e3b20f} .timeline .m.b{background:#e8743b} .timeline .m.w{background:var(--away);opacity:.9}
  .timeline .m.q{background:var(--q);width:2px;min-width:2px}
  .timeline .head{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
  .field{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:var(--field)}
  .field .lbl{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field .txt{white-space:pre-wrap;word-wrap:break-word;min-height:24px;font-size:15px}
  .k-p{background:var(--paste);border-radius:3px} .k-b,.k-d{background:var(--big);border-radius:3px}
  .caret{display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:-2px;animation:blink 1s infinite}
  select{font:inherit;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--field);color:var(--ink)}
  .moments{max-height:260px;overflow:auto}
  .moments div{padding:7px 10px;border-radius:8px;cursor:pointer;font-size:14px}
  .moments div:hover{background:var(--soft)}
  .mono{font-family:'JetBrains Mono',monospace}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:30px}

  /* Тематические курсоры: домик — обычный, ключ — на кнопках и ссылках */
  html,body{cursor:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2228%22 height=%2228%22 viewBox=%220 0 28 28%22%3E%3Cpath d=%22M14 2 L26.5 13.5 H23 V25.5 H5 V13.5 H1.5 Z%22 fill=%22%231f6f5c%22 stroke=%22%23fff%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3Crect x=%2211.5%22 y=%2217%22 width=%225%22 height=%228.5%22 rx=%221%22 fill=%22%23fff%22/%3E%3Crect x=%2218%22 y=%2215%22 width=%223%22 height=%223%22 fill=%22%23ffe08a%22/%3E%3C/svg%3E") 14 2, auto}
  a,button,.btn,.brand,.theme,select,summary,label,.timeline,.moments div,input[type=checkbox],input[type=file]{cursor:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2228%22 height=%2228%22 viewBox=%220 0 28 28%22%3E%3Cg stroke-linecap=%22round%22 fill=%22none%22%3E%3Cpath d=%22M3 3 L17 17 M6.5 6.5 L9.5 3.5 M10 10 L13 7%22 stroke=%22%23fff%22 stroke-width=%225.5%22/%3E%3Ccircle cx=%2220.5%22 cy=%2220.5%22 r=%225%22 stroke=%22%23fff%22 stroke-width=%225.5%22/%3E%3Cpath d=%22M3 3 L17 17 M6.5 6.5 L9.5 3.5 M10 10 L13 7%22 stroke=%22%23c9961a%22 stroke-width=%222.6%22/%3E%3Ccircle cx=%2220.5%22 cy=%2220.5%22 r=%225%22 stroke=%22%23c9961a%22 stroke-width=%222.6%22/%3E%3C/g%3E%3C/svg%3E") 3 3, pointer}
  textarea,input[type=text]{cursor:text}
  .btn:disabled{cursor:not-allowed}
</style>
<style>
  .answer-view{white-space:pre-wrap;word-wrap:break-word;font-size:15px}
  .qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .qhead .t{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="brand" onclick="go('task-'+TASKS[0].id)"><svg class="logo" width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2 L26.5 13.5 H23 V25.5 H5 V13.5 H1.5 Z" fill="var(--accent)" stroke="var(--card)" stroke-width="1.5" stroke-linejoin="round"/><rect x="11.5" y="17" width="5" height="8.5" rx="1" fill="var(--card)"/><rect x="18" y="15" width="3" height="3" fill="#ffe08a"/></svg><span>Планета Недвижимость</span></div>
  <div class="row"><nav id="nav"></nav><button class="theme" id="theme" title="Сменить тему" aria-label="Сменить тему"></button></div>
</header>
<main id="app"></main>
<footer>Прототип тестового задания для «Планеты Недвижимость».</footer>

<script>
/* =====================================================================
   ЗАДАНИЯ. Чтобы добавить или поменять задание — отредактируйте этот блок.
   id        — короткое имя латиницей; ссылка на задание: страница#task-<id>
   body      — текст задания: пустая строка = новый абзац, "- " = список,
               "1. " = нумерованный список, **жирный**
   defense   — вопросы «защиты»: из pool случайно выбирается ask вопросов,
               они идут по одному, вернуться назад нельзя; hint — подсказка
   ===================================================================== */
const TASKS = [
  {
    id: 'e',
    title: 'Где интернет врёт',
    deadline: '48 часов',
    minChars: 150,
    answerLabel: 'Ваш отчёт',
    body: `О «Планете Недвижимость» в интернете много информации: сайт, объявления на Циан и Авито, карточки на картах. Где-то в ней есть **расхождение с реальностью**. Мы заложили его специально, и найти его, не выходя из интернета, нельзя.

**Подсказка:** расхождение касается одного из объектов, которые сейчас продаются через агентство.

1. Найдите, где информация об агентстве или его объектах не совпадает с тем, что происходит на самом деле.
2. Опишите, как вы это выяснили: куда смотрели, кому звонили или писали, что спрашивали.
3. Предложите, как сделать, чтобы такие расхождения больше не появлялись.

Отчёт пишите прямо в поле ниже: черновик сохраняется, страницу можно закрывать и открывать снова. После отчёта будет короткая «защита»: несколько вопросов по одному.`,
    defense: {
      ask: 3,
      hint: 'Обычно на вопрос хватает 1–2 минут. Отвечайте своими словами, как в разговоре.',
      pool: [
        'Кто дал вам ключевую информацию? Как его зовут или какая у него роль, и что он сказал — своими словами, как запомнили.',
        'Какая версия была у вас первой и оказалась неверной? Что заставило от неё отказаться?',
        'Какой факт в вашем отчёте самый слабый — что вы не успели проверить лично?',
        'Я перезваниваю тому же человеку, и он говорит обратное. Что вы сделаете в первые 10 минут?',
        'Если бы у вас было не 48 часов, а 2 часа, — с чего бы вы начали и что бы выбросили?',
        'Назовите одну деталь, которую вы узнали в разговоре и которой точно нет в интернете.'
      ]
    }
  }
];
/* ===================================================================== */

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function md(src){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return src.trim().split(/\n\s*\n/).map(block=>{
    const lines = block.split('\n');
    if(lines.every(l=>/^\s*- /.test(l))) return '<ul>'+lines.map(l=>'<li>'+inline(l.replace(/^\s*- /,''))+'</li>').join('')+'</ul>';
    if(lines.every(l=>/^\s*\d+\. /.test(l))) return '<ol>'+lines.map(l=>'<li>'+inline(l.replace(/^\s*\d+\. /,''))+'</li>').join('')+'</ol>';
    return '<p>'+lines.map(inline).join('<br>')+'</p>';
  }).join('');
}
const fmtDur = ms => { ms = Math.max(0, Math.round(ms/1000)); const h=Math.floor(ms/3600), m=Math.floor(ms%3600/60), s=ms%60;
  return h ? `${h} ч ${m} мин` : m ? `${m} мин ${s} с` : `${s} с`; };
const clock = ms => { ms=Math.max(0,Math.round(ms/1000)); const m=Math.floor(ms/60), s=ms%60; return `${m}:${String(s).padStart(2,'0')}`; };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------- Маршруты ---------- */
let cleanup = [];
function go(h){ if(location.hash.replace('#','')===h) route(); else location.hash = h; }
function route(){
  cleanup.forEach(f=>f()); cleanup=[];
  const h = location.hash.replace('#','');
  const nav = [['task-'+TASKS[0].id, 'Пройти задание'], ['review', 'Просмотр ответа']];
  const onTask = !h.startsWith('review');
  $('#nav').innerHTML = nav.map(([k,t])=>`<a href="#${k}" class="${(k==='review') !== onTask ?'on':''}">${t}</a>`).join('');
  window.scrollTo(0,0);
  if(h.startsWith('task-')){ const t = TASKS.find(x=>'task-'+x.id===h); return t ? Candidate(t) : notFound(); }
  if(h==='review') return Review();
  Candidate(TASKS[0]);
}
window.addEventListener('hashchange', route);
function notFound(){ app.innerHTML = `<div class="card"><h2>Такого задания нет</h2><p>Проверьте ссылку. Доступные задания: ${TASKS.map(t=>`<a href="#task-${t.id}">${esc(t.title)}</a>`).join(', ')}</p></div>`; }

/* ---------- Кандидат ---------- */
function Candidate(task){
  const KEY = 'pn-task-'+task.id;
  let S = store.get(KEY);
  const save = () => store.set(KEY, S);

  function render(){
    if(!S) return intro();
    if(S.phase==='main') return mainPhase();
    if(S.phase==='defense') return defensePhase();
    return donePhase();
  }

  function intro(){
    app.innerHTML = `
      <span class="pill">Тестовое задание · срок ${esc(task.deadline)}</span>
      <h1 style="margin-top:14px">${esc(task.title)}</h1>
      <div class="card task-body">${md(task.body)}</div>
      <div class="card">
        <label class="small muted" for="nm">Ваше имя</label>
        <input type="text" id="nm" placeholder="Как к вам обращаться" style="margin:6px 0 14px">
        <button class="btn green" id="start">Начать задание</button>
      </div>`;
    $('#start').onclick = () => {
      const name = $('#nm').value.trim();
      if(!name){ $('#nm').focus(); $('#nm').style.borderColor='var(--red)'; return; }
      S = { v:2, task:{id:task.id, title:task.title}, name, start: Date.now(), phase:'main', report:'', answers:[] };
      save(); render();
    };
  }

  function mainPhase(){
    app.innerHTML = `
      <div class="row" style="justify-content:space-between"><span class="pill">${esc(task.title)} · ${esc(S.name)}</span><span class="small muted" id="el"></span></div>
      <details class="card task-body" open><summary style="cursor:pointer;font-weight:700;margin-bottom:8px">Задание</summary>${md(task.body)}</details>
      <div class="card">
        <label class="small muted" for="ans">${esc(task.answerLabel)}</label>
        <textarea class="answer" id="ans" style="margin-top:6px" placeholder="Пишите здесь. Черновик сохраняется автоматически."></textarea>
        <div class="row" style="justify-content:space-between;margin-top:10px">
          <span class="small muted" id="cnt"></span>
          <button class="btn green" id="toDef">Сдать отчёт и перейти к защите</button>
        </div>
      </div>`;
    const ta = $('#ans'); ta.value = S.report || '';
    let t = null;
    const upd = () => { const n = ta.value.trim().length; $('#cnt').textContent = `${n} символов` + (n < task.minChars ? ` · минимум ${task.minChars}` : ''); $('#toDef').disabled = n < task.minChars; };
    ta.addEventListener('input', () => { S.report = ta.value; save(); upd(); }); upd();
    const tick = () => { const el = $('#el'); if(el) el.textContent = 'С начала прошло ' + fmtDur(Date.now() - S.start); };
    tick(); const iv = setInterval(tick, 1000); cleanup.push(()=>{ clearInterval(iv); clearTimeout(t); save(); });
    $('#toDef').onclick = () => modal(`<h2>Сдать отчёт?</h2><p>После этого отчёт нельзя будет изменить. Дальше ${task.defense.ask} вопроса по одному: вопрос появится сразу, вернуться к предыдущему нельзя. ${esc(task.defense.hint||'')}</p>`,
      [['Ещё поработаю', null], ['Начать защиту', () => {
        S.report = ta.value; S.submittedAt = Date.now();
        S.answers = shuffle(task.defense.pool).slice(0, task.defense.ask).map(q=>({q, a:'', ms:null}));
        S.phase = 'defense'; S.qi = 0; S.qShownAt = null; save(); render();
      }]]);
  }

  function defensePhase(){
    const cur = S.answers[S.qi];
    if(!cur){ S.phase='done'; S.finishedAt = Date.now(); save(); return render(); }
    if(S.qShownAt){ // страницу перезагрузили во время вопроса — продолжаем тот же вопрос, время идёт
    } else { S.qShownAt = Date.now(); save(); }
    app.innerHTML = `
      <span class="pill">Защита · вопрос ${S.qi+1} из ${S.answers.length}</span>
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:flex-end"><h2 style="max-width:620px">${esc(cur.q)}</h2><div class="timer" id="tm" title="Сколько времени прошло"></div></div>
        <p class="small muted" style="margin:6px 0 14px">${esc(task.defense.hint||'')}</p>
        <textarea class="qa" id="qa" placeholder="Ваш ответ"></textarea>
        <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn green" id="qok">Ответить</button></div>
      </div>`;
    const ta = $('#qa'); ta.value = cur.a || ''; ta.focus();
    ta.addEventListener('input', () => { cur.a = ta.value; save(); });
    const tick = () => { const tm=$('#tm'); if(tm) tm.textContent = clock(Date.now() - S.qShownAt); };
    const iv = setInterval(tick, 500); tick(); cleanup.push(()=>clearInterval(iv));
    $('#qok').onclick = () => {
      if(!ta.value.trim()){ ta.focus(); ta.style.borderColor='var(--red)'; return; }
      clearInterval(iv); cur.a = ta.value; cur.ms = Date.now() - S.qShownAt;
      S.qi++; S.qShownAt = null; save(); render();
    };
  }

  async function donePhase(){
    app.innerHTML = `
      <h1>Готово, спасибо!</h1>
      <p class="lead">Скопируйте код результата и отправьте его работодателю. В нём ваш отчёт и ответы на вопросы защиты.</p>
      <div class="card">
        <textarea class="code" id="code" readonly>Готовлю код…</textarea>
        <div class="row" style="margin-top:10px"><button class="btn green" id="cp">Скопировать код</button><span class="small muted" id="cpm"></span></div>
      </div>
      <p class="small muted">Код сохранён в этом браузере: если закроете страницу, он будет здесь же. <a href="#" id="reset">Пройти заново</a></p>`;
    const code = await encodeResult(S);
    $('#code').value = code;
    $('#cp').onclick = async () => { try{ await navigator.clipboard.writeText(code); $('#cpm').textContent = 'Скопировано'; }catch(e){ $('#code').select(); $('#cpm').textContent = 'Код выделен — нажмите Ctrl+C'; } };
    $('#reset').onclick = e => { e.preventDefault(); modal('<h2>Начать заново?</h2><p>Текущий результат будет удалён из браузера. Если вы ещё не отправили код — сначала скопируйте его.</p>', [['Отмена', null], ['Удалить и начать', ()=>{ store.del(KEY); S=null; render(); }]]); };
  }

  render();
}

/* ---------- Модальное окно ---------- */
function modal(html, buttons){
  const m = document.createElement('div'); m.className='modal';
  m.innerHTML = `<div class="card">${html}<div class="row" style="justify-content:flex-end;margin-top:10px">${buttons.map((b,i)=>`<button class="btn ${i===buttons.length-1?'green':'ghost'}" data-i="${i}">${esc(b[0])}</button>`).join('')}</div></div>`;
  m.onclick = e => { const i = e.target.dataset && e.target.dataset.i; if(i===undefined && e.target!==m) return; m.remove(); if(i!==undefined && buttons[i][1]) buttons[i][1](); };
  document.body.appendChild(m);
}

/* ---------- Код результата ---------- */
function b64enc(bytes){ let s=''; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s); }
function b64dec(str){ const s=atob(str); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b; }
async function encodeResult(S){
  const data = {v:2, task:S.task, name:S.name, start:S.start, submittedAt:S.submittedAt, finishedAt:S.finishedAt, report:S.report, answers:S.answers};
  const json = JSON.stringify(data);
  if('CompressionStream' in window){
    try{ const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer(); return 'PN1:'+b64enc(new Uint8Array(buf)); }catch(e){}
  }
  return 'PN0:'+b64enc(new TextEncoder().encode(json));
}
async function decodeResult(code){
  code = code.trim().replace(/\s+/g,'');
  if(code.startsWith('PN1:')){ const bytes=b64dec(code.slice(4)); const txt = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); return JSON.parse(txt); }
  if(code.startsWith('PN0:')) return JSON.parse(new TextDecoder().decode(b64dec(code.slice(4))));
  if(code.startsWith('{')) return JSON.parse(code);
  throw new Error('Не похоже на код результата: он должен начинаться с PN1: или PN0:');
}

/* ---------- Просмотр ответа ---------- */
function Review(){
  app.innerHTML = `
    <h1>Просмотр ответа</h1>
    <p class="lead">Вставьте код результата, который прислал кандидат.</p>
    <div class="card">
      <textarea class="code" id="inp" placeholder="PN1:…"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="load">Открыть ответ</button>
        <span class="small" id="err" style="color:var(--red)"></span>
      </div>
    </div>
    <div id="res"></div>`;
  const open = async txt => { $('#err').textContent=''; try{ showResult(await decodeResult(txt)); }catch(e){ $('#err').textContent = e.message || 'Не удалось прочитать код'; } };
  $('#load').onclick = () => open($('#inp').value);
}

function showResult(R){
  const started = new Date(R.start).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  const res = $('#res');
  res.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(R.name)}</h2><span class="muted small">«${esc(R.task.title)}» · начало ${started}</span></div>
    </div>
    <div class="grid3">
      <div class="metric"><b>${R.submittedAt ? fmtDur(R.submittedAt - R.start) : '—'}</b><span>на отчёт</span></div>
      <div class="metric"><b>${(R.report||'').trim().length}</b><span>символов в отчёте</span></div>
      <div class="metric"><b>${fmtDur((R.answers||[]).reduce((a,x)=>a+(x.ms||0),0))}</b><span>на защиту</span></div>
    </div>
    <div class="card"><h2>Отчёт</h2><div class="answer-view">${esc(R.report||'')}</div></div>
    <div class="card"><h2>Защита</h2>
      ${(R.answers||[]).map((x,i)=>`<div class="field"><div class="qhead"><div class="lbl">Вопрос ${i+1}. ${esc(x.q)}</div><span class="t">${x.ms!=null?'ответ за '+fmtDur(x.ms):'без ответа'}</span></div><div class="answer-view">${esc(x.a||'')}</div></div>`).join('')}
    </div>`;
  res.scrollIntoView({behavior:'smooth'});
}

/* ---------- Тема ---------- */
function paintTheme(){ const d = document.documentElement.dataset.theme==='dark'; const b=$('#theme'); b.textContent = d ? '☀' : '☾'; b.title = d ? 'Светлая тема' : 'Ночная тема'; }
$('#theme').onclick = () => { const t = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try{ localStorage.setItem('prc-theme', t); }catch(e){} paintTheme(); };
paintTheme();

route();
</script>
